apiVersion: v1
kind: Pod
metadata:
  name: broken-livenessprobe
  namespace: default
  labels:
    test-scenario: livenessprobe
spec:
  restartPolicy: Always
  containers:
    - name: fake-healthy-app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      livenessProbe:
        httpGet:
          path: /saglik-kontrolu
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 2